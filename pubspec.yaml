name: expense_tracker
description: Aplikasi pencatatan pengeluaran dengan arsitektur MVC dan database SQLite.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  fl_chart: ^1.3.1
  http: ^1.6.0
  package_info_plus: ^10.2.2
  ota_update: ^7.1.0
  excel: ^4.0.6
  file_picker: ^13.4.1
  geocoding: ^5.0.1
  geolocator: ^14.0.1
  url_launcher: ^6.3.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
